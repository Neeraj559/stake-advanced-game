<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>3D Glass Bridge - Stake Engine</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div class="stage-wrapper">
        <div class="top-bar">
            <div class="brand-title">GLASS BRIDGE 3D</div>
            <div class="wallet-box">
                <span class="lbl">BALANCE</span>
                <span class="val" id="balance-display">$1,000.00</span>
            </div>
        </div>

        <div class="viewport-3d" id="viewport">
            <div class="decision-overlay">
                <button class="choice-btn" id="btn-left" disabled>LEFT ◀</button>
                <button class="choice-btn" id="btn-right" disabled>RIGHT ▶</button>
            </div>
        </div>

        <div class="control-dashboard">
            <span class="lbl">BET AMOUNT ($)</span>
            <div class="input-row">
                <div class="input-shell">
                    <input type="number" id="bet-input" value="10" min="1" step="1">
                </div>
                <button class="btn-modifier" id="btn-half">½</button>
                <button class="btn-modifier" id="btn-double">2×</button>
            </div>

            <button class="main-action-btn btn-start" id="main-btn">START CROSSING</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
