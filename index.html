<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Spider-Man: Gates of Power</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.2.4/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div class="stage-wrapper">
        <div class="top-header">
            <div class="game-title">SPIDER-MAN 1000</div>
            <div class="sub-header">PAYS ANYWHERE • CLUSTER CASCADE</div>
        </div>

        <div class="arena-container">
            <div class="hud-card mult-hud">
                <span class="hud-label">MULTIPLIER</span>
                <span class="hud-val" id="mult-display">1x</span>
            </div>

            <div class="hud-card spidey-hud">
                <div class="spidey-icon">🕷️</div>
            </div>

            <div id="game-canvas"></div>

            <div class="win-toast" id="win-toast">
                TUMBLE WIN <span id="toast-amount">$0.00</span>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="stat-group">
                <div class="stat-item">
                    <span class="lbl">Credit</span>
                    <span class="val" id="balance-display">$1,000.00</span>
                </div>
                <div class="stat-item">
                    <span class="lbl">Bet</span>
                    <span class="val" id="bet-display">$10.00</span>
                </div>
            </div>

            <div class="win-box">
                <span class="lbl">WIN</span>
                <span class="win-val" id="win-display">$0.00</span>
            </div>

            <button id="spin-btn" class="btn-spin">
                <span class="spin-icon">↻</span>
            </button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
