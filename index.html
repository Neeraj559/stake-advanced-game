<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stake VIP Slots</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.2.4/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div class="game-container">
        <div class="header-title">⚡ STAKE VIP SLOTS ⚡</div>
        
        <div id="canvas-container">
            <div id="win-overlay" class="win-overlay">
                <div class="win-title" id="win-title">BIG WIN!</div>
                <div class="win-payout" id="win-overlay-amount">+$50.00</div>
            </div>
        </div>

        <div class="controls-panel">
            <div class="stat-box">
                <span class="stat-label">Balance</span>
                <span class="stat-value" id="balance-display">$1,000.00</span>
            </div>

            <div class="stat-box">
                <span class="stat-label">Bet</span>
                <span class="stat-value" id="bet-display">$10.00</span>
            </div>

            <div class="stat-box">
                <span class="stat-label">Last Win</span>
                <span class="stat-value win" id="win-display">$0.00</span>
            </div>

            <button id="spin-btn" class="btn-spin">SPIN</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
