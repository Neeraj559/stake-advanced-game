<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Glass Bridge - Stake Edition</title>
    <link rel="stylesheet" href="style.css">
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="stage-wrapper">
        <!-- Top Bar -->
        <div class="top-bar">
            <span class="brand-title">GLASS BRIDGE 3D</span>
            <div class="top-actions">
                <button class="icon-btn" id="sound-toggle-btn">🔊</button>
                <button class="icon-btn" id="fairness-btn">⚖ Fair</button>
                <div class="wallet-box">
                    <span class="lbl">BALANCE</span>
                    <span class="val" id="balance-display">$1,000.00</span>
                </div>
            </div>
        </div>

        <!-- Mode Select -->
        <div class="mode-tabs">
            <button class="mode-tab active" id="tab-manual">Manual</button>
            <button class="mode-tab" id="tab-auto">Auto-Play</button>
        </div>

        <!-- Multiplier Progress Bar -->
        <div class="multiplier-bar-container" id="mult-bar"></div>

        <!-- 3D Viewport Area -->
        <div class="viewport-3d" id="viewport">
            <div class="step-hud-badge" id="step-hud">MEDIUM • STEP 1 / 13 • 1.18x</div>

            <!-- Stake Win Banner Overlay -->
            <div class="stake-win-card" id="stake-win-card">
                <div class="win-card-inner">
                    <div class="win-multiplier" id="win-multiplier">1.18×</div>
                    <div class="win-divider"></div>
                    <div class="win-payout-box">
                        <span class="crypto-icon">💎</span>
                        <span class="payout-amt" id="win-payout">$11.80</span>
                    </div>
                </div>
            </div>

            <!-- In-game Action Controls -->
            <div class="decision-overlay" id="decision-buttons"></div>
        </div>

        <!-- Auto Config Box (Hidden by default) -->
        <div class="auto-row" id="auto-config-box" style="display: none;">
            <div class="auto-field">
                <span class="lbl">NUMBER OF BETS</span>
                <input type="number" id="auto-rounds-input" value="10" min="1" max="100">
            </div>
            <div class="auto-field">
                <span class="lbl">STOP ON STEP (1-13)</span>
                <input type="number" id="auto-steps-input" value="3" min="1" max="13">
            </div>
        </div>

        <!-- Control Panel -->
        <div class="control-dashboard">
            <div class="difficulty-pill-box">
                <button class="diff-btn" data-diff="easy">EASY</button>
                <button class="diff-btn active" data-diff="medium">MEDIUM</button>
                <button class="diff-btn" data-diff="hard">HARD</button>
                <button class="diff-btn" data-diff="extreme">EXTREME</button>
            </div>

            <span class="lbl">BET AMOUNT ($)</span>
            <div class="input-row">
                <div class="input-shell">
                    <input type="number" id="bet-input" value="10" min="1" max="10000" step="1">
                </div>
                <button class="btn-modifier" id="btn-half">½</button>
                <button class="btn-modifier" id="btn-double">2×</button>
                <button class="btn-modifier" id="btn-max">MAX</button>
            </div>

            <div class="quick-chips-row">
                <button class="chip-btn" data-amt="5">$5</button>
                <button class="chip-btn" data-amt="10">$10</button>
                <button class="chip-btn" data-amt="25">$25</button>
                <button class="chip-btn" data-amt="50">$50</button>
                <button class="chip-btn" data-amt="100">$100</button>
            </div>

            <button class="main-action-btn btn-start" id="main-btn">START CROSSING</button>
        </div>

        <!-- History Ledger -->
        <div class="history-container">
            <div class="history-title">RECENT BETS</div>
            <div class="history-list" id="history-list"></div>
        </div>
    </div>

    <!-- Provably Fair Modal -->
    <div class="modal-backdrop" id="fairness-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>⚖ Provably Fair</h3>
                <button class="modal-close" id="close-modal-btn">✕</button>
            </div>
            <div class="modal-body">
                <span class="lbl">SERVER SEED (HASHED)</span>
                <input type="text" id="server-seed-hash" readonly>
                
                <span class="lbl">CLIENT SEED</span>
                <input type="text" id="client-seed" value="stake-user-seed-777">
                
                <span class="lbl">NONCE</span>
                <input type="text" id="fairness-nonce" readonly>
                
                <p class="modal-info">Every glass panel layout is determined mathematically using SHA-256 before the round starts.</p>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
